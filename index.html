<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Droneboard has moved</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://cypherpunk.today/droneboard/">
<meta http-equiv="refresh" content="1; url=https://cypherpunk.today/droneboard/">
<script>
(function () {
  var p = location.pathname.replace(/^\/droneboard(\/|$)/, '');
  if (/(^|\/)(index|404)\.html$/.test(p)) p = p.replace(/(index|404)\.html$/, '');
  location.replace('https://cypherpunk.today/droneboard/' + p + location.search + location.hash);
})();
</script>
</head>
<body>
<p>Droneboard has moved to <a href="https://cypherpunk.today/droneboard/">cypherpunk.today/droneboard/</a>.</p>
</body>
</html>
