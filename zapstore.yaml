name: Droneboard
summary: An offline keyboard that feels like Gboard, with multilingual swipe, on-device neural predictions and offline dictation.
description: |
  Droneboard is an open-source Android keyboard with no INTERNET permission. Everything it does happens on the phone.

  You can swipe in several languages at once without switching: Czech, Slovak, English, German, Spanish, Dutch and Hungarian, plus Slovak and Czech without diacritics. Swipe runs on the FUTO Swipe encoder with Droneboard's own decoder, which also learns the words you type. Next-word suggestions come from a small neural network that runs on the phone and predicts only in the languages you enabled.

  The microphone at the right end of the suggestion strip starts dictation. The keyboard records the audio itself, also from Bluetooth headsets, LE Audio and hearing aids, and Offline Speech to Text turns it into text on the phone. Long dictation is split, so it keeps going past one minute.

  It looks and behaves like Gboard: Material You colours, the typed word in the middle of the strip, no silent autocorrection, emoji search by any part of a word, and a trackpad on the space bar. Clipboard history, split and one-handed layouts and themes come from HeliBoard, which Droneboard is based on.

  On tablets and unfolded foldables it starts as a compact, phone-sized keyboard you can resize and move.

  This is a beta.
